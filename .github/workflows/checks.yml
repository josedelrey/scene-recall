name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python 3.12 (${{ matrix.environment }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: base
            extras: ""
          - environment: visualization
            extras: "--extra visualization"
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and select Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.12"
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked ${{ matrix.extras }}
      - name: Verify dependency configuration
        env:
          CONFIGURATION: ${{ matrix.environment }}
        run: |
          uv run --no-sync python - <<'PY'
          import importlib.util
          import os

          has_sdk = importlib.util.find_spec("rerun") is not None
          assert has_sdk == (os.environ["CONFIGURATION"] == "visualization")
          if has_sdk:
              import rerun
          PY
      - name: Run tests
        run: uv run --no-sync pytest -q
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
