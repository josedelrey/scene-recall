[project]
name = "scene-recall"
version = "0.1.0"
description = "Persistent open-vocabulary 3D scene memory for robotic perception"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "opencv-python-headless>=4.4",
    "pillow>=13.0.0",
]

[project.optional-dependencies]
visualization = [
    "rerun-sdk>=0.38,<0.39",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
